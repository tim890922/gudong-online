name: CI

on:
  push:
    branches: [main]
  pull_request:

# fork 發來的 PR 也會跑：只給讀取權限，不使用任何 secret
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install
        working-directory: cloudflare
        run: npm ci
      - name: Typecheck
        working-directory: cloudflare
        run: npm run typecheck
      - name: Test
        working-directory: cloudflare
        run: npm test

  backend:
    name: Python backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: backend
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Worker
        working-directory: cloudflare
        run: npm ci
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start Worker
        working-directory: cloudflare
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:8787/api/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/wrangler.log"
          exit 1
      - name: Six phones play full games
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8787
        run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
