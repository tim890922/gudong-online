version: 2
updates:
  # workflow 裡的 action 都釘在 commit SHA，靠 Dependabot 更新
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # 小版本合成一個 PR；大版本各自開 PR，方便個別評估相容性
  - package-ecosystem: npm
    directories: [/frontend, /cloudflare]
    schedule:
      interval: monthly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # 跟著執行環境 Node 22，不跳大版本
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python:
        update-types: [minor, patch]
